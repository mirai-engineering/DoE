[project]
name = "mirai-doe-engine-api"
version = "0.1.0"
description = "Generic tabular Design of Experiments optimization backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.0.0",
    "botorch>=0.17.2",
    "gpytorch>=1.15.2",
]

[dependency-groups]
dev = [
    "torch>=2.0.0",
    "onnx>=1.15.0",
    "onnxscript>=0.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
