[project]
name = "mirai-doe-engine-api"
version = "0.1.0"
description = "Generic tabular Design of Experiments optimization backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "pydantic>=2.0.0",
    "botorch>=0.17.2",
    "gpytorch>=1.15.2",
    "mlflow>=3.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "python-multipart>=0.0.9",
    "ydata-profiling>=4.18.4",
    "pyjwt[crypto]>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
]

[project.scripts]
mirai-github-mcp = "agent_tools.github_mcp.cli:main"

[dependency-groups]
dev = [
    "torch>=2.0.0",
    "onnx>=1.15.0",
    "onnxscript>=0.1.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
agent = [
    "mcp>=1.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ml_lifecycle"]
