services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: mirai-doe-engine-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Runtime artifacts are bundled into the backend container.
    # Uncomment below for development if you need to mount local artifacts:
    # volumes:
    #   - ./backend/artifacts:/app/artifacts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://frontend:3000}
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mirai-doe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: mirai-doe-engine-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - mirai-doe-network

networks:
  mirai-doe-network:
    driver: bridge
