services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: mirai-doe-engine-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mirai-doe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: mirai-doe-engine-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - mirai-doe-network

  nginx-proxy:
    image: nginx:alpine
    container_name: mirai-doe-engine-nginx
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - mirai-doe-network

networks:
  mirai-doe-network:
    driver: bridge